name: Validate game

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Type check web and server
        run: npm run typecheck
      - name: Test simulation and combat
        run: npm test
      - name: Build production frontend
        run: npm run build
        env:
          NEXT_PUBLIC_SERVER_URL: https://ghost-arena.162.19.137.169.sslip.io
